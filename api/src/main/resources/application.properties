spring.application.name=api

# Database credentials are not stored in this file. Locally they come from
# local.properties (copy local.properties.example to create it), which is
# gitignored. In Docker, the SPRING_DATASOURCE_* environment variables take
# precedence over both files, so no credentials are ever committed.
spring.config.import=optional:file:./local.properties

# Tells Spring Boot to always run schema.sql and data.sql on startup
spring.sql.init.mode=always

# Let Hibernate automatically create/update the tables based on your Java classes
spring.jpa.hibernate.ddl-auto=update

# Print the SQL queries in the console
spring.jpa.show-sql=true
